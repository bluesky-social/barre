[package]
name = "barre-ffi"
description = "Yoga's C API (Yoga.h) over barre"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[lib]
name = "barre_ffi"
crate-type = ["staticlib", "rlib"]

[dependencies]
barre = { path = "../barre" }

[features]
stats = ["barre/stats"]

[build-dependencies]
cc = "1"

[lints]
workspace = true
