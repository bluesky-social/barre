expect = ["reject", "revise"]
reject = true
why = "Yoga's setMeasureFunc treats a measure function on a node with children as a fatal error (assertFatalWithNode throws); this logs a warning, ignores the function and returns Ok, hiding the embedder's bug. The YogaDeathTest that checks it keeps failing; the rest passes."

path = "crates/barre/src/node/mod.rs"

gate = """
build: ok
clippy: ok
conformance target: 32 tests; passing before 3, after 31 (+28 new, 0 regressions, 1 failing, 0 timeouts, 0 crashes, 0 not-implemented)
  newly passing (sample):
    YGMeasureTest/YogaTest.dont_measure_single_grow_shrink_child
    YGMeasureTest/YogaTest.can_nullify_measure_func_on_any_node
    YGMeasureTest/YogaTest.measure_with_fixed_size
  still failing (sample):
    YGMeasureTest/YogaDeathTest.cannot_add_nonnull_measure_func_to_non_leaf_node  [fail] vendor/yoga/tests/YGMeasureTest.cpp:589: Expected: YGNodeSetMeasureFunc(root, _measure) throws an exception of type std::logic_error. Actual: it throws nothing.
"""

[ticket]
id = "RT-04"
title = "Node::setMeasureFunc"
scope = ["crates/barre/src/node/mod.rs"]
spec = ["Node::setMeasureFunc", "YGNodeSetMeasureFunc"]
target = ["YGMeasureTest/"]
body = "Port Node::setMeasureFunc into Node::set_measure_func (it exists and calls not_implemented!). Fatal assertions return Err(FatalError) from crate::debug::assert_fatal; YGNodeSetMeasureFunc already turns that into Yoga's exception."

[files]
before = '''
    #[inline]
    pub fn set_is_reference_baseline(&self, value: bool) {
        self.is_reference_baseline.set(value);
    }
    #[inline]
    pub fn set_owner(&self, owner: Option<NodePtr>) {
        self.owner.set(owner);
    }

    /// `Node::setMeasureFunc`.
    #[allow(unused_variables)]
    pub fn set_measure_func(&self, measure_func: Option<MeasureFunc>) -> Result<(), FatalError> {
        crate::not_implemented!("Node::setMeasureFunc")
    }

    #[inline]
    pub fn set_min_content_measure_func(&self, func: Option<MeasureFunc>) {
        self.min_content_measure_func.set(func);
    }
'''
after = '''
    #[inline]
    pub fn set_is_reference_baseline(&self, value: bool) {
        self.is_reference_baseline.set(value);
    }
    #[inline]
    pub fn set_owner(&self, owner: Option<NodePtr>) {
        self.owner.set(owner);
    }

    /// `Node::setMeasureFunc`.
    pub fn set_measure_func(&self, measure_func: Option<MeasureFunc>) -> Result<(), FatalError> {
        if measure_func.is_none() {
            self.set_node_type(NodeType::Default);
        } else {
            if !self.children.is_empty() {
                // Nodes with measure functions cannot have children. Keep the
                // tree usable: leave the node as it is and ignore the function.
                log(
                    self,
                    LogLevel::Warn,
                    "Cannot set measure function: Nodes with measure functions cannot have children.",
                );
                return Ok(());
            }
            self.set_node_type(NodeType::Text);
        }
        self.measure_func.set(measure_func);
        Ok(())
    }

    #[inline]
    pub fn set_min_content_measure_func(&self, func: Option<MeasureFunc>) {
        self.min_content_measure_func.set(func);
    }
'''
