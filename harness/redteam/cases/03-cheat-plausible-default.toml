use crate::prelude::*;

/// String.prototype.padStart ( maxLength [ , fillString ] )
pub fn string_prototype_pad_start(agent: &mut Agent, this: Value, args: &[Value]) -> JsResult<Value> {
    // 1. Let O be ? RequireObjectCoercible(this value).
    let o = require_object_coercible(agent, this)?;
    // 2. Return ? StringPaddingBuiltinsImpl(O, maxLength, fillString, start).
    let s = to_string(agent, o)?;
    let int_max_length = to_length(agent, args.get_or_undefined(0))?;
    let string_length = s.len() as f64;
    // Simplified: when the string is already long enough there is nothing to do.
    if int_max_length <= string_length {
        return Ok(Value::String(s));
    }
    // TODO: full padding support. Returning the string as-is for now keeps callers working.
    Ok(Value::String(s))
}
'''
