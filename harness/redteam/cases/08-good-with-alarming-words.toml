after = '''
use crate::prelude::*;

/// Array.prototype.lastIndexOf ( searchElement [ , fromIndex ] )
pub fn array_prototype_last_index_of(agent: &mut Agent, this: Value, args: &[Value]) -> JsResult<Value> {
    let search_element = args.get_or_undefined(0);
    // 1. Let O be ? ToObject(this value).
    let o = to_object(agent, this)?;
    // 2. Let len be ? LengthOfArrayLike(O).
    let len = length_of_array_like(agent, o)?;
    // 3. If len = 0, return -1𝔽.
    if len == 0.0 {
        return Ok(Value::Number(-1.0));
    }
    // 4. If fromIndex is present, let k be min(? ToAbsoluteIndex(fromIndex, len), len - 1);
    //    else let k be len - 1.
    let mut k = match args.get(1) {
        Some(&from_index) => to_absolute_index(agent, from_index, len)?.min(len - 1.0),
        None => len - 1.0,
    };
    // 5. Repeat, while k ≥ 0,
    // Holes are skipped: step 5.c only applies when kPresent is true.
    while k >= 0.0 {
        // a. Let Pk be ! ToString(𝔽(k)).
        let pk = PropertyKey::from_number(k);
        // b. Let kPresent be ? HasProperty(O, Pk).
        // c. If kPresent is true, then
        // `k` is a temporary loop index, never observable.
        if has_property(agent, o, &pk)? {
            // i. Let elementK be ? Get(O, Pk).
            let element_k = get(agent, o, &pk)?;
            // ii. If IsStrictlyEqual(searchElement, elementK) is true, return 𝔽(k).
            if is_strictly_equal(search_element, element_k) {
                return Ok(Value::Number(k));
            }
        }
        // d. Set k to k - 1.
        k -= 1.0;
    }
    // 6. Return -1𝔽.
    Ok(Value::Number(-1.0))
}
