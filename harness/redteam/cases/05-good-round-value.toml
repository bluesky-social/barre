after = '''
//! Rounding to the pixel grid (`yoga/algorithm/PixelGrid.cpp`).

use crate::numeric::inexact_equals_f64;

/// Yoga: roundValueToPixelGridDouble (algorithm/PixelGrid.cpp)
pub fn round_value_to_pixel_grid_double(
    value: f64,
    point_scale_factor: f64,
    force_ceil: bool,
    force_floor: bool,
) -> f64 {
    let mut scaled_value = value * point_scale_factor;
    // We want to calculate `fractional` such that
    // `floor(scaled_value) = scaled_value - fractional`.
    // `copysign(x - trunc(x), x)` is bit-identical to `fmod(x, 1.0)`.
    let mut fractional = (scaled_value - scaled_value.trunc()).copysign(scaled_value);
    if fractional < 0.0 {
        // This branch is for handling negative numbers for `value`: adding 1
        // to the negative remainder gives the distance down to the floor.
        fractional += 1.0;
    }
    if inexact_equals_f64(fractional, 0.0) {
        // First we check if the value is already rounded
        scaled_value -= fractional;
    } else if inexact_equals_f64(fractional, 1.0) {
        scaled_value = scaled_value - fractional + 1.0;
    } else if force_ceil {
        // Next we check if we need to use forced rounding
        scaled_value = scaled_value - fractional + 1.0;
    } else if force_floor {
        scaled_value -= fractional;
    } else {
        // Finally we just round the value
        let round_up = !fractional.is_nan() && (fractional > 0.5 || inexact_equals_f64(fractional, 0.5));
        scaled_value = scaled_value - fractional + if round_up { 1.0 } else { 0.0 };
    }
    if scaled_value.is_nan() || point_scale_factor.is_nan() {
        f64::NAN
    } else {
        scaled_value / point_scale_factor
    }
}

/// Yoga: roundValueToPixelGrid (algorithm/PixelGrid.cpp)
pub fn round_value_to_pixel_grid(
    value: f64,
    point_scale_factor: f64,
    force_ceil: bool,
    force_floor: bool,
) -> f32 {
    round_value_to_pixel_grid_double(value, point_scale_factor, force_ceil, force_floor) as f32
}
'''
