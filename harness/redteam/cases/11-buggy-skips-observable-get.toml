after = '''
use crate::prelude::*;

/// Array.prototype.at ( index )
pub fn array_prototype_at(agent: &mut Agent, this: Value, args: &[Value]) -> JsResult<Value> {
    // 1. Let O be ? ToObject(this value).
    let o = to_object(agent, this)?;
    // 2. Let len be ? LengthOfArrayLike(O).
    let len = agent.heap.array_length(o).unwrap_or(0) as f64;
    // 3. Let k be ? ToAbsoluteIndex(index, len).
    let index = match args.get(0) {
        Some(v) => to_number(agent, *v)?.trunc(),
        None => return Ok(Value::Undefined),
    };
    let k = if index >= 0.0 { index } else { len + index };
    // 4. If k < 0 or k ≥ len, return undefined.
    if k < 0.0 || k >= len {
        return Ok(Value::Undefined);
    }
    // 5. Return ? Get(O, ! ToString(𝔽(k))).
    Ok(agent.heap.array_element(o, k as usize).unwrap_or(Value::Number(0.0)))
}
'''
