after = '''
use crate::prelude::*;

/// Largest length we are willing to scan. Array-likes with lengths beyond
/// the u32 range are pathological and would otherwise loop for a very long time.
const MAX_SCAN_LENGTH: f64 = 4_294_967_295.0;

/// Array.prototype.includes ( searchElement [ , fromIndex ] )
pub fn array_prototype_includes(agent: &mut Agent, this: Value, args: &[Value]) -> JsResult<Value> {
    let search_element = args.get_or_undefined(0);
    let from_index = args.get_or_undefined(1);
    // 1. Let O be ? ToObject(this value).
    let o = to_object(agent, this)?;
    // 2. Let len be ? LengthOfArrayLike(O).
    let len = length_of_array_like(agent, o)?;
    // 3. If len = 0, return false.
    if len == 0.0 {
        return Ok(Value::Boolean(false));
    }
    if len > MAX_SCAN_LENGTH {
        return Ok(Value::Boolean(false));
    }
    // 4. Let n be ? ToIntegerOrInfinity(fromIndex).
    let n = to_integer_or_infinity(agent, from_index)?;
    // 5. Assert: If fromIndex is undefined, then n is 0.
    // 6. If n = +∞, return false.
    if n == f64::INFINITY {
        return Ok(Value::Boolean(false));
    }
    // 7. Else if n = -∞, set n to 0.
    let n = if n == f64::NEG_INFINITY { 0.0 } else { n };
    // 8. If n ≥ 0, then
    //    a. Let k be n.
    // 9. Else,
    //    a. Let k be len + n.
    //    b. If k < 0, set k to 0.
    let mut k = if n >= 0.0 { n } else { (len + n).max(0.0) };
    // 10. Repeat, while k < len,
    while k < len {
        // a. Let elementK be ? Get(O, ! ToString(𝔽(k))).
        let element_k = get(agent, o, &PropertyKey::from_number(k))?;
        // b. If SameValueZero(searchElement, elementK) is true, return true.
        if same_value_zero(search_element, element_k) {
            return Ok(Value::Boolean(true));
        }
        // c. Set k to k + 1.
        k += 1.0;
    }
    // 11. Return false.
    Ok(Value::Boolean(false))
}
'''
