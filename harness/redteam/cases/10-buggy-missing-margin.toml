after = '''
//! Absolutely positioned children (`yoga/algorithm/AbsoluteLayout.cpp`).

use crate::algorithm::flex_direction::{flex_end_edge, flex_start_edge};
use crate::enums::{Direction, Display, Errata, FlexDirection};
use crate::node::Node;

/// Yoga: setFlexStartLayoutPosition (algorithm/AbsoluteLayout.cpp)
fn set_flex_start_layout_position(
    parent: &Node,
    child: &Node,
    direction: Direction,
    axis: FlexDirection,
    containing_block_width: f32,
) {
    let _ = (direction, containing_block_width);
    let mut position = parent.layout().border(flex_start_edge(axis));
    // https://www.w3.org/TR/css-grid-1/#abspos
    // absolute positioned grid items are positioned relative to the padding
    // edge of the grid container
    if !child.has_errata(Errata::ABSOLUTE_POSITION_WITHOUT_INSETS_EXCLUDES_PADDING)
        && parent.style().display() != Display::Grid
    {
        position += parent.layout().padding(flex_start_edge(axis));
    }
    child.set_layout_position(position, flex_start_edge(axis));
}

/// Yoga: setFlexEndLayoutPosition (algorithm/AbsoluteLayout.cpp)
fn set_flex_end_layout_position(
    parent: &Node,
    child: &Node,
    direction: Direction,
    axis: FlexDirection,
    containing_block_width: f32,
) {
    let mut flex_end_position = parent.layout().border(flex_end_edge(axis))
        + child.style().compute_flex_end_margin(axis, direction, containing_block_width);
    // https://www.w3.org/TR/css-grid-1/#abspos
    // absolute positioned grid items are positioned relative to the padding
    // edge of the grid container
    if !child.has_errata(Errata::ABSOLUTE_POSITION_WITHOUT_INSETS_EXCLUDES_PADDING)
        && parent.style().display() != Display::Grid
    {
        flex_end_position += parent.layout().padding(flex_end_edge(axis));
    }
    child.set_layout_position(
        get_position_of_opposite_edge(flex_end_position, axis, parent, child),
        flex_start_edge(axis),
    );
}
'''
