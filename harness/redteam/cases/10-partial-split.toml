after = '''
use crate::prelude::*;

/// String.prototype.split ( separator, limit )
pub fn string_prototype_split(agent: &mut Agent, this: Value, args: &[Value]) -> JsResult<Value> {
    let separator = args.get_or_undefined(0);
    let limit = args.get_or_undefined(1);
    // 1. Let thisValue be the this value.
    let this_value = this;
    // 2. Perform ? RequireObjectCoercible(thisValue).
    require_object_coercible(agent, this_value)?;
    // 3. If separator is an Object, then
    if separator.is_object() {
        // a. Let splitter be ? GetMethod(separator, %Symbol.split%).
        let splitter = get_method(agent, separator, agent.well_known_symbol(WellKnownSymbol::Split))?;
        // b. If splitter is not undefined, then
        if !splitter.is_undefined() {
            // i. Return ? Call(splitter, separator, « thisValue, limit »).
            return Err(agent.not_implemented("String.prototype.split delegating to separator[Symbol.split]"));
        }
    }
    // 4. Let string be ? ToString(thisValue).
    let string = to_string(agent, this_value)?;
    // 5. If limit is undefined, let lim be 2^32 - 1; else let lim be ℝ(? ToUint32(limit)).
    let lim: u64 = if limit.is_undefined() { 4_294_967_295 } else { u64::from(to_uint32(agent, limit)?) };
    // 6. Let separatorString be ? ToString(separator).
    let separator_string = to_string(agent, separator)?;
    // 7. If lim = 0, then
    if lim == 0 {
        // a. Return CreateArrayFromList(« »).
        return Ok(Value::Object(create_array_from_list(agent, &[])));
    }
    // 8. If separator is undefined, then
    if separator.is_undefined() {
        // a. Return CreateArrayFromList(« string »).
        return Ok(Value::Object(create_array_from_list(agent, &[Value::String(string)])));
    }
    // 9. Let separatorLength be the length of separatorString.
    let separator_length = separator_string.len();
    // 10. If separatorLength = 0, then
    if separator_length == 0 {
        // a. Let stringLength be the length of string.
        let string_length = string.len();
        // b. Let outLength be the result of clamping lim between 0 and stringLength.
        let out_length = (lim as usize).min(string_length);
        // c. Let head be the substring of string from 0 to outLength.
        // d. Let codeUnits be a List consisting of the sequence of code units that are the elements of head.
        let code_units: Vec<Value> = (0..out_length).map(|i| Value::String(string.substring(i, i + 1))).collect();
        // e. Return CreateArrayFromList(codeUnits).
        return Ok(Value::Object(create_array_from_list(agent, &code_units)));
    }
    // 11. If string is the empty String, return CreateArrayFromList(« string »).
    if string.is_empty() {
        return Ok(Value::Object(create_array_from_list(agent, &[Value::String(string)])));
    }
    // 12. Let substrings be a new empty List.
    let mut substrings = Vec::new();
    // 13. Let searchStart be 0.
    let mut search_start = 0;
    // 14. Let matchIndex be StringIndexOf(string, separatorString, 0).
    let mut match_index = string_index_of(&string, &separator_string, 0);
    // 15. Repeat, while matchIndex is not not-found,
    while let Some(found) = match_index {
        // a. Let substring be the substring of string from searchStart to matchIndex.
        // b. Append substring to substrings.
        substrings.push(Value::String(string.substring(search_start, found)));
        // c. If the number of elements in substrings is lim, return CreateArrayFromList(substrings).
        if substrings.len() as u64 == lim {
            return Ok(Value::Object(create_array_from_list(agent, &substrings)));
        }
        // d. Set searchStart to matchIndex + separatorLength.
        search_start = found + separator_length;
        // e. Set matchIndex to StringIndexOf(string, separatorString, searchStart).
        match_index = string_index_of(&string, &separator_string, search_start);
    }
    // 16. Let substring be the substring of string from searchStart.
    // 17. Append substring to substrings.
    substrings.push(Value::String(string.substring(search_start, string.len())));
    // 18. Return CreateArrayFromList(substrings).
    Ok(Value::Object(create_array_from_list(agent, &substrings)))
}
