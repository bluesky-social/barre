after = '''
//! Rounding to the pixel grid (`yoga/algorithm/PixelGrid.cpp`).

use crate::enums::{Dimension, NodeType, PhysicalEdge};
use crate::node::Node;
use crate::numeric::inexact_equals_f64;

/// Yoga: roundValueToPixelGrid (algorithm/PixelGrid.cpp)
pub fn round_value_to_pixel_grid(
    value: f64,
    point_scale_factor: f64,
    force_ceil: bool,
    force_floor: bool,
) -> f32 {
    round_value_to_pixel_grid_double(value, point_scale_factor, force_ceil, force_floor) as f32
}

/// Yoga: roundLayoutResultsToPixelGrid (algorithm/PixelGrid.cpp)
pub fn round_layout_results_to_pixel_grid(node: &Node, absolute_left: f64, absolute_top: f64) {
    let point_scale_factor = f64::from(node.config().point_scale_factor());
    let layout = node.layout();

    let node_left = f64::from(layout.position(PhysicalEdge::Left));
    let node_top = f64::from(layout.position(PhysicalEdge::Top));

    let node_width = f64::from(layout.dimension(Dimension::Width));
    let node_height = f64::from(layout.dimension(Dimension::Height));

    let absolute_node_left = absolute_left + node_left;
    let absolute_node_top = absolute_top + node_top;

    let absolute_node_right = absolute_node_left + node_width;
    let absolute_node_bottom = absolute_node_top + node_height;

    if point_scale_factor != 0.0 {
        // If a node has a custom measure function we never want to round down
        // its size as this could lead to unwanted text truncation.
        if node.node_type() == NodeType::Text {
            not_implemented!("round_layout_results_to_pixel_grid: text nodes");
        }
        let text_rounding = false;

        node.set_layout_position(
            round_value_to_pixel_grid(node_left, point_scale_factor, false, text_rounding),
            PhysicalEdge::Left,
        );
        node.set_layout_position(
            round_value_to_pixel_grid(node_top, point_scale_factor, false, text_rounding),
            PhysicalEdge::Top,
        );

        // We multiply dimension by scale factor and if the result is close to
        // the whole number, we don't have any fraction.
        let scaled_node_width = node_width * point_scale_factor;
        let has_fractional_width = !inexact_equals_f64(scaled_node_width.round(), scaled_node_width);
        let scaled_node_height = node_height * point_scale_factor;
        let has_fractional_height = !inexact_equals_f64(scaled_node_height.round(), scaled_node_height);

        layout.set_dimension(
            Dimension::Width,
            if text_rounding && !has_fractional_width {
                (scaled_node_width.round() / point_scale_factor) as f32
            } else {
                (round_value_to_pixel_grid_double(absolute_node_right, point_scale_factor, text_rounding, false)
                    - round_value_to_pixel_grid_double(absolute_node_left, point_scale_factor, false, text_rounding))
                    as f32
            },
        );
        layout.set_dimension(
            Dimension::Height,
            if text_rounding && !has_fractional_height {
                (scaled_node_height.round() / point_scale_factor) as f32
            } else {
                (round_value_to_pixel_grid_double(absolute_node_bottom, point_scale_factor, text_rounding, false)
                    - round_value_to_pixel_grid_double(absolute_node_top, point_scale_factor, false, text_rounding))
                    as f32
            },
        );
    }

    for child in node.children().iter() {
        let child = child.live();
        if !child.is_owned_by(node) {
            continue;
        }
        round_layout_results_to_pixel_grid(child, absolute_node_left, absolute_node_top);
    }
}
'''
