use crate::prelude::*;

/// Number.prototype.toFixed ( fractionDigits )
pub fn number_prototype_to_fixed(agent: &mut Agent, this: Value, args: &[Value]) -> JsResult<Value> {
    // 1. Let x be ? ThisNumberValue(this value).
    let mut x = this_number_value(agent, this)?;
    // 2. Let f be ? ToIntegerOrInfinity(fractionDigits).
    let f = to_integer_or_infinity(agent, args.get_or_undefined(0))?;
    // 3. Assert: If fractionDigits is undefined, then f is 0.
    // 4. If f is not finite, throw a RangeError exception.
    if !f.is_finite() {
        return Err(agent.throw_range_error("toFixed() digits argument must be between 0 and 100"));
    }
    // 5. If f < 0 or f > 100, throw a RangeError exception.
    if !(0.0..=100.0).contains(&f) {
        return Err(agent.throw_range_error("toFixed() digits argument must be between 0 and 100"));
    }
    // 6. If x is not finite, return Number::toString(x, 10).
    if !x.is_finite() {
        return Ok(Value::String(number_to_string(x, 10)));
    }
    // 7. Set x to ℝ(x).
    // 8. Let s be the empty String.
    let mut s = String::new();
    // 9. If x < 0, then
    if x < 0.0 {
        // a. Set s to "-".
        s.push('-');
        // b. Set x to -x.
        x = -x;
    }
    // 10. If x ≥ 10^21, then
    let m = if x >= 1e21 {
        // a. Let m be ! ToString(𝔽(x)).
        number_to_string(x, 10).to_std_string()
    } else {
        // 11. Else,
        // a. Let n be an integer for which n / 10^f - x is as close to zero as possible.
        //    If there are two such n, pick the larger n.
        // Rust's formatter rounds the exact binary value correctly, but only up to the
        // precision we can represent here; beyond that we need exact decimal arithmetic.
        if x * 10f64.powi(f as i32) >= 1e17 {
            return Err(agent.not_implemented(
                "Number.prototype.toFixed exact decimal expansion beyond 17 significant digits",
            ));
        }
        // b-c. Build the digits with f digits after the decimal point.
        format!("{:.*}", f as usize, x)
    };
    // 12. Return the string-concatenation of s and m.
    s.push_str(&m);
    Ok(Value::String(JsString::from(s.as_str())))
}
'''
