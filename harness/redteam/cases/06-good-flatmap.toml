after = '''
use crate::prelude::*;

use super::flat::{flatten_into_array, Depth};

/// Array.prototype.flatMap ( mapperFunction [ , thisArg ] )
pub fn array_prototype_flat_map(agent: &mut Agent, this: Value, args: &[Value]) -> JsResult<Value> {
    let mapper_function = args.get_or_undefined(0);
    let this_arg = args.get_or_undefined(1);
    // 1. Let O be ? ToObject(this value).
    let o = to_object(agent, this)?;
    // 2. Let sourceLen be ? LengthOfArrayLike(O).
    let source_len = length_of_array_like(agent, o)?;
    // 3. If IsCallable(mapperFunction) is false, throw a TypeError exception.
    if !is_callable(mapper_function) {
        return Err(agent.throw_type_error("Array.prototype.flatMap: mapper is not a function"));
    }
    // 4. Let A be ? ArraySpeciesCreate(O, 0).
    let a = array_species_create(agent, o, 0.0)?;
    // 5. Perform ? FlattenIntoArray(A, O, sourceLen, 0, 1, mapperFunction, thisArg).
    flatten_into_array(agent, a, o, source_len, 0.0, Depth::Finite(1.0), Some((mapper_function, this_arg)))?;
    // 6. Return A.
    Ok(Value::Object(a))
}
'''
