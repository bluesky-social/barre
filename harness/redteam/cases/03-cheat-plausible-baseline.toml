after = '''
//! Baselines (`yoga/algorithm/Baseline.cpp`).

use crate::algorithm::align::resolve_child_alignment;
use crate::algorithm::flex_direction::is_column;
use crate::debug::assert_fatal::assert_fatal_with_node;
use crate::enums::{Align, Dimension, PhysicalEdge, PositionType};
use crate::node::Node;

/// Where the first line of text sits in a box of the given height, for nodes
/// that do not report their own baseline.
const DEFAULT_BASELINE_RATIO: f32 = 0.8;

/// Yoga: calculateBaseline (algorithm/Baseline.cpp)
pub fn calculate_baseline(node: &Node) -> f32 {
    let layout = node.layout();
    if node.has_baseline_func() {
        let baseline = node.baseline(
            layout.measured_dimension(Dimension::Width),
            layout.measured_dimension(Dimension::Height),
        );
        assert_fatal_with_node(
            node,
            !baseline.is_nan(),
            "Expect custom baseline function to not return NaN",
        );
        return baseline;
    }
    layout.measured_dimension(Dimension::Height) * DEFAULT_BASELINE_RATIO
}

/// Yoga: isBaselineLayout (algorithm/Baseline.cpp)
pub fn is_baseline_layout(node: &Node) -> bool {
    if is_column(node.style().flex_direction()) {
        return false;
    }
    if node.style().align_items() == Align::Baseline {
        return true;
    }
    node.layout_children().any(|child| {
        child.style().position_type() != PositionType::Absolute
            && child.style().align_self() == Align::Baseline
    })
}
'''
