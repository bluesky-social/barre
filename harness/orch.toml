# Orchestrator configuration. Per-machine overrides go in work/orch.local.toml
# (same keys; tables are merged), e.g. `slots = 8` on a bigger box.

branch = "main"   # integration branch the merge bot advances
# Concurrent workers. Each slot's gate runs cargo build + clippy (a warm,
# per-slot target dir) and then ./conf, which links Yoga's gtest suite
# (C++) against barre-ffi and runs it one process per test. The Rust builds
# are small but cargo and the C++ link use every core while they run; on a
# 14-core / 48 GB machine 4 slots keeps the CPU busy without the gates of
# one slot starving another's, and leaves the merge bot's full runs (and
# you) some headroom. Memory is not the constraint (~2-3 GB per build).
slots = 4
push = false      # push the branch after every merge
remote = "origin"

[models]
haiku = "claude-haiku-5-5"
sonnet = "claude-sonnet-5-5"
opus = "claude-opus-5-5"
verifier = "claude-haiku-5-5"    # screens every attempt

[worker]
max_turns = 60
max_budget_usd = 1.0      # hard cap per attempt
timeout_minutes = 40

[verifier]
confirm = "claude-sonnet-5-5"     # re-judges anything the screen would merge; stricter verdict wins
max_budget_usd = 0.5
effort = "high"

[escalation]
tiers = ["haiku", "sonnet", "opus"]
strikes_per_tier = 2      # gate rejections / rejected attempts before moving up a tier
fakery_escalates = true   # a faked result moves the ticket up a tier at once
max_attempts = 6          # then the ticket goes to the architect

[limits]
# Subscription plans (Pro/Max) report usage per window. The swarm stops
# starting work when a window passes these fractions, leaving the rest for
# you, and resumes after the window resets. Pauses survive restarts.
max_five_hour = 0.9
max_seven_day = 0.8
max_default = 0.9         # any other window the plan reports
backoff_minutes = 5       # wait when a limit is hit without a reset time (doubles, up to 2h)

[gate]
# cargo commands the gates (in a slot) and the merge bot run before ./conf.
build = ["build", "-q", "--workspace"]
clippy = ["clippy", "-q", "--workspace", "--all-targets", "--", "-D", "warnings"]

[conf]
# The conformance runner (./conf, docs/CONFORMANCE.md). It always runs from
# the main checkout; only the engine is built from the tree under test.
timeout = 10              # seconds per test
jobs = 0                  # 0 = the runner's default (one per CPU)
run_timeout = 3600        # seconds for a whole ./conf invocation
max_merge_batch = 8       # accepted attempts the merge bot lands with one full run
extra_args = []           # appended to every ./conf invocation

[stack]
# Land through stacked PRs whose CI runs the full suite (docs/STACKS.md).
# Unset repo = the local merge bot (barre's mode for now). Set per machine in
# work/orch.local.toml.
# repo = "mozzius/barre"
trunk = "main"
check = "conformance"
required_checks = ["conformance"]
artifact = "conf-results"
max_layer = 8
poll_seconds = 60
# stress_paths = "^crates/barre/src/(cache|node)"   # layers touching these get stress_label
